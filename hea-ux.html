<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX põhitõed - hea kasutajakogemuse näide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Kasutajakogemuse (UX) põhitõed</h1>
    <nav aria-label="Peamenüü">
      <ul>
        <li><a href="index.html">Pealeht</a></li>
        <li><a href="halb-ux.html">Halb UX</a></li>
        <li><a href="hea-ux.html">Hea UX</a></li>
      </ul>
    </nav>
  </header>

  <main class="good-ux">
    <div class="contact">
      <h2>Võta meiega ühendust</h2>
      <!-- TODO: Lisa mingisugune pilt -->

      <form action="/cgi-bin/contact.py" method="POST">
        <div>
          <label for="name">Nimi</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">E-maili aadress</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="subject">Teema</label>
          <input type="text" id="subject" name="subject">
        </div>
        <div>
          <label for="content">Sisu</label>
          <textarea id="content" name="content" required></textarea>
        </div>
        
        <div class="buttons">
          <button class="clear" type="button">Tühjenda</button>
          <button class="submit" type="submit">Saada</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
